<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        body{
            background-color: cadetblue;
            text-align: center;
            margin: 0;
            padding: 0;
        }
        h1{
            display: inline-block;
            font-size: 43px;
        }
        button{
            margin: 8px;
            padding: 8px 15px;
            background-color: cornflowerblue;
            color: black;
            border: none;
            font-size: 18px;
            cursor: pointer;
            border-radius: 15px;
        }
        button:nth-child(1){
            background-color: navy;
            color: aliceblue;
        }
        button:nth-child(2){
            background-color: rgb(129, 37, 37);
            color: aliceblue;
        }
        button:nth-child(3){
            background-color: rgb(175, 175, 55);
            color: aliceblue;
        }
        button:nth-child(4){
            background-color: rgb(184, 19, 52);
            color: aliceblue;
        }
        button:hover{
            opacity: 0.80;
        }
        input{
            padding: 8px;
            border-radius: 4px;
            border: none;
            margin-top: 12px;
        }
        ul{
            list-style: none;
            padding: 19px;
        }
        li{
            background-color: antiquewhite;
            color: black;
            margin: 8px auto;
            padding: 8px;
            width: 200px;
            border-radius: 6px;
        }
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STOPWATCH</title>
</head>
<body>
    <h1 style="text-align: center; color: burlywood; font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; ">MY STOPWATCH 🔥</h1>
    <hr>
    <div>
        <h1 id="hour">00</h1>
        <h1>:</h1>
        <h1 id="min">00</h1>
        <h1>:</h1>
        <h1 id="sec">00</h1>
        <h1>:</h1>
        <h1 id="msec">00</h1>
    </div>

    <div>
        <button id="btn" onclick="start()">START</button>
        <button onclick="stop()">STOP</button>
        <button onclick="reset()">RESET</button>
        <button onclick="lap()">LAP</button>
    </div>

    <div>
        <h2 style="color: beige; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">SET TARGET IN SECONDS</h2>
        <input type="number" id="targetnum" placeholder="ENTER YOUR TARGET IN SECONDS">
    </div>

    <ul id="laps"></ul>

    <script src="app.js"></script>
</body>
</html>
